spring.application.name=home-inventory

# Environment variables keep machine-specific credentials out of source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/home_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# "update" compares the entities with the database and adds missing schema objects.
# It is convenient while learning; use versioned migrations (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
