spring.application.name=home-inventory

# Load machine-specific development settings from backend/.env when it exists.
# The file uses Java properties syntax and is ignored by Git.
spring.config.import=optional:file:.env[.properties]

# Environment variables keep machine-specific credentials out of source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/home_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Google OpenID Connect signs users in; the application keeps its own session.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.allowed-emails=${APP_AUTH_ALLOWED_EMAILS:}
app.auth.allow-all=${APP_AUTH_ALLOW_ALL:false}

# Keep the session cookie unreadable to JavaScript. Set secure=true in HTTPS deployments.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.forward-headers-strategy=framework

# "update" compares the entities with the database and adds missing schema objects.
# It is convenient while learning; use versioned migrations (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Item photos are stored outside the database under opaque, generated filenames.
app.photo-storage.location=${PHOTO_STORAGE_LOCATION:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Run small, idempotent schema adjustments for existing PostgreSQL databases.
spring.sql.init.mode=always
# Keep PostgreSQL DO blocks intact; statements in schema.sql end with ^^^.
spring.sql.init.separator=^^^

server.error.include-message=never
